description: 'Avid Ventures is a boutique early-stage venture capital firm founded in 2021 by Addie Lerner
  Katz, backing founders from pre-incorporation through growth across fintech, consumer, software, and
  emerging AI. The firm emphasizes hands-on, vertically integrated support — recruiting, go-to-market
  and customer introductions, and fundraising help — investing across the U.S., Europe, and Israel. It
  launched with a $68M debut fund in February 2021 and raised an $87M Fund II in September 2024 (roughly
  $165M in total capital under management). Surfaced as a portfolio-adjacent firm of Foundry Group and
  profiled in the API Evangelist network as a venture-capital company record.'
